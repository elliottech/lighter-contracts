[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
cache_path  = 'cache_forge'
via_ir = true
optimizer = true
optimizer_runs = 1000
solc = '0.8.25'
evm_version = 'cancun'
# OpenZeppelin's BeaconProxy requires its abstract Proxy base, but nothing
# deploys that base directly. Excluding its standalone artifact also avoids a
# Foundry source-suffix collision with contracts/proxy/Proxy.sol.
#
# To speed-up production compilations, we skip test by default
skip = ['test/**', 'node_modules/@openzeppelin/contracts/proxy/Proxy.sol']
